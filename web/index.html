<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Tagesabrechnung für Kinokassen">

  <!-- Verhindert Browser-Caching von index.html — stellt sicher, dass immer die aktuelle Version geladen wird -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Kassenabrechnung">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Kassenabrechnung</title>
  <link rel="manifest" href="manifest.json">

  <style>
    #splash {
      position: fixed;
      inset: 0;
      background: #5C0A0A;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      z-index: 9999;
      transition: opacity 0.3s ease;
    }
    #splash img {
      width: 96px;
      height: 96px;
    }
    /* Ladebalken: sichtbar solange die Seite lädt bzw. neu lädt (Start,
       erzwungenes Neu-Laden, Auto-Update, Fresh-Tab-Reset) — verschwindet
       zusammen mit #splash beim ersten Flutter-Frame. */
    #splash-balken-spur {
      width: 25vw;
      height: 6px;
      background: rgba(255, 255, 255, 0.25);
      border-radius: 3px;
      overflow: hidden;
    }
    #splash-balken-fuellung {
      width: 40%;
      height: 100%;
      background: #FF9800;
      border-radius: 3px;
      animation: splash-balken-lauf 1.4s ease-in-out infinite;
    }
    @keyframes splash-balken-lauf {
      0% { margin-left: -40%; }
      100% { margin-left: 100%; }
    }
  </style>

  <!-- Fängt das beforeinstallprompt-Event ab, damit Flutter es programmatisch auslösen kann -->
  <script>
    window._pwaInstallEvent = null;
    window.addEventListener('beforeinstallprompt', function(e) {
      e.preventDefault();
      window._pwaInstallEvent = e;
    });
  </script>
  <script>
    // Löscht alle Caches + meldet alle Service Worker ab. Gemeinsam genutzt
    // vom Fresh-Tab-Reset und vom erzwungenen Neu-Laden (Button + Auto-
    // Update) — ein einfacher Reload allein würde weiterhin vom (evtl.
    // veralteten) Service-Worker-Cache bedient statt vom Server.
    function _purgeCachesUndSw() {
      if (!('serviceWorker' in navigator)) return Promise.resolve();
      return caches.keys().then(function(keys) {
        return Promise.all(keys.map(function(k) { return caches.delete(k); }));
      }).then(function() {
        return navigator.serviceWorker.getRegistrations();
      }).then(function(regs) {
        return Promise.all(regs.map(function(r) { return r.unregister(); }));
      });
    }

    // Beim ersten Öffnen eines neuen Tabs: SW-Cache leeren + SW deregistrieren + neu laden.
    // sessionStorage verhindert eine Reload-Schleife (wird beim Tab-Schließen zurückgesetzt).
    if ('serviceWorker' in navigator && !sessionStorage.getItem('_swFreshLoaded')) {
      sessionStorage.setItem('_swFreshLoaded', '1');
      _purgeCachesUndSw().then(function() {
        location.reload();
      });
    }
  </script>
  <script>
    var _swUpdateReady = false;
    var _hadController = !!(navigator.serviceWorker && navigator.serviceWorker.controller);
    function _reloadPage() {
      _purgeCachesUndSw().then(function() {
        window.location.reload();
      }).catch(function() {
        window.location.reload();
      });
    }
    if ('serviceWorker' in navigator) {
      // Primär: feuert wenn neuer SW via skipWaiting() die Kontrolle übernimmt (Flutter-Default)
      navigator.serviceWorker.addEventListener('controllerchange', function() {
        if (_hadController) {
          _swUpdateReady = true;
        }
      });
      // Fallback für SWs ohne skipWaiting()
      navigator.serviceWorker.getRegistration().then(function(reg) {
        if (!reg) return;
        if (reg.waiting && navigator.serviceWorker.controller) {
          _swUpdateReady = true;
          return;
        }
        reg.addEventListener('updatefound', function() {
          var newWorker = reg.installing;
          if (!newWorker) return;
          newWorker.addEventListener('statechange', function() {
            if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
              _swUpdateReady = true;
            }
          });
        });
        reg.update().catch(function() {});
        // Periodisch prüfen — neue Version könnte während die App offen ist deployed werden
        setInterval(function() { reg.update().catch(function() {}); }, 3600000);
      });
      // PWA hat keine Tabs: beim Zurückkehren aus dem Hintergrund (Home-Bildschirm-Icon
      // erneut geöffnet) läuft kein neuer Seitenaufbau, daher hier aktiv nachfragen.
      document.addEventListener('visibilitychange', function() {
        if (document.visibilityState === 'visible') {
          navigator.serviceWorker.getRegistration().then(function(reg) {
            if (reg) reg.update().catch(function() {});
          });
        }
      });
    }
  </script>
</head>
<body>
  <div id="splash">
    <img src="icons/Icon-192.png" alt="">
    <div id="splash-balken-spur">
      <div id="splash-balken-fuellung"></div>
    </div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('splash');
      if (!splash) return;
      splash.style.opacity = '0';
      setTimeout(function () { splash.remove(); }, 300);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>

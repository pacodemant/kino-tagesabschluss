<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Tagesabrechnung für Kinokassen">

  <!-- Verhindert Browser-Caching von index.html — stellt sicher, dass immer die aktuelle Version geladen wird -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Kassenabrechnung">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Kassenabrechnung</title>
  <link rel="manifest" href="manifest.json">

  <style>
    #splash {
      position: fixed;
      inset: 0;
      background: #5C0A0A;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      z-index: 9999;
      transition: opacity 0.3s ease;
    }
    #splash img {
      width: 96px;
      height: 96px;
    }
    /* Ladebalken: sichtbar solange die Seite lädt bzw. neu lädt (Start,
       erzwungenes Neu-Laden, Auto-Update, Fresh-Tab-Reset) — verschwindet
       zusammen mit #splash beim ersten Flutter-Frame. */
    #splash-balken-spur {
      width: 25vw;
      height: 6px;
      background: rgba(255, 255, 255, 0.25);
      border-radius: 3px;
      overflow: hidden;
    }
    #splash-balken-fuellung {
      width: 40%;
      height: 100%;
      background: #FF9800;
      border-radius: 3px;
      animation: splash-balken-lauf 1.4s ease-in-out infinite;
    }
    @keyframes splash-balken-lauf {
      0% { margin-left: -40%; }
      100% { margin-left: 100%; }
    }
  </style>

  <!-- Fängt das beforeinstallprompt-Event ab, damit Flutter es programmatisch auslösen kann -->
  <script>
    window._pwaInstallEvent = null;
    window.addEventListener('beforeinstallprompt', function(e) {
      e.preventDefault();
      window._pwaInstallEvent = e;
    });
  </script>
  <script>
    // Löscht alle Caches + meldet alle Service Worker ab. Gemeinsam genutzt
    // vom Fresh-Tab-Reset und vom erzwungenen Neu-Laden (Button + Auto-
    // Update) — ein einfacher Reload allein würde weiterhin vom (evtl.
    // veralteten) Service-Worker-Cache bedient statt vom Server.
    function _purgeCachesUndSw() {
      if (!('serviceWorker' in navigator)) return Promise.resolve();
      return caches.keys().then(function(keys) {
        return Promise.all(keys.map(function(k) { return caches.delete(k); }));
      }).then(function() {
        return navigator.serviceWorker.getRegistrations();
      }).then(function(regs) {
        return Promise.all(regs.map(function(r) { return r.unregister(); }));
      });
    }

    // Beim ersten Öffnen eines neuen Tabs: SW-Cache leeren + SW deregistrieren + neu laden.
    // sessionStorage verhindert eine Reload-Schleife (wird beim Tab-Schließen zurückgesetzt).
    // Nur online: offline gibt es nach dem Löschen weder Cache noch SW mehr,
    // wodurch der erzwungene Reload zwingend am Netzwerk scheitert (Flugmodus-
    // Start würde sonst nie über den Splash-Screen hinauskommen).
    if ('serviceWorker' in navigator && !sessionStorage.getItem('_swFreshLoaded') && navigator.onLine) {
      sessionStorage.setItem('_swFreshLoaded', '1');
      _purgeCachesUndSw().then(function() {
        location.reload();
      });
    }
  </script>
  <script>
    var _swUpdateReady = false;
    function _reloadPage() {
      _purgeCachesUndSw().then(function() {
        window.location.reload();
      }).catch(function() {
        window.location.reload();
      });
    }

    // Update-Erkennung über version.json statt über den Service Worker:
    // Flutter generiert seit 3.44.5 keinen versionierten SW mehr (siehe
    // github.com/flutter/flutter/issues/156910) — die SW-Datei ändert
    // sich nie mehr zwischen Builds, ein Vergleich darüber würde also
    // nie mehr anschlagen. Stattdessen wird die kleine version.json
    // verglichen, höchstens 1x pro Tag, ausgelöst beim Laden und beim
    // Zurückkehren aus dem Hintergrund (PWA hat keine Tabs, daher hier
    // aktiv nachfragen statt auf einen neuen Seitenaufbau zu warten).
    var _currentBuildNumber = null;
    var _lastUpdateCheckKey = 'kbg_last_update_check';
    var _oneDayMs = 24 * 60 * 60 * 1000;

    function _fetchBuildNumber() {
      return fetch('version.json', { cache: 'no-store' })
        .then(function(r) { return r.json(); })
        .then(function(j) { return j.build_number; })
        .catch(function() { return null; });
    }

    function _checkForUpdate() {
      if (!navigator.onLine) return;
      var last = parseInt(localStorage.getItem(_lastUpdateCheckKey) || '0', 10);
      if (Date.now() - last < _oneDayMs) return;
      localStorage.setItem(_lastUpdateCheckKey, String(Date.now()));
      _fetchBuildNumber().then(function(remote) {
        if (remote && _currentBuildNumber && remote !== _currentBuildNumber) {
          _swUpdateReady = true;
        }
      });
    }

    _fetchBuildNumber().then(function(v) { _currentBuildNumber = v; });

    document.addEventListener('visibilitychange', function() {
      if (document.visibilityState === 'visible') {
        _checkForUpdate();
      }
    });
  </script>
</head>
<body>
  <div id="splash">
    <img src="icons/Icon-192.png" alt="">
    <div id="splash-balken-spur">
      <div id="splash-balken-fuellung"></div>
    </div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('splash');
      if (!splash) return;
      splash.style.opacity = '0';
      setTimeout(function () { splash.remove(); }, 300);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
